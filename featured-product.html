<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fujail Furniture — Featured Piece</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ivory:#f7f3ec; --paper:#fffdfa; --charcoal:#26221d; --charcoal-soft:#4a443c;
    --wood-deep:#7d5539; --line:#e4dccc; --accent:#8c6a4a;
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ivory:#1b1712; --paper:#221d17; --charcoal:#f3ede2; --charcoal-soft:#cfc4b3; --line:#3a3226; --accent:#c79b6f;
    }
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:'Inter',system-ui,sans-serif; background:var(--ivory); color:var(--charcoal); line-height:1.6; -webkit-font-smoothing:antialiased;}
  h1,.serif{font-family:'Fraunces',Georgia,serif; font-weight:500; letter-spacing:-0.01em;}
  a{color:inherit; text-decoration:none;}
  .wrap{max-width:1100px; margin:0 auto; padding:0 24px;}
  .eyebrow{font-size:.72rem; letter-spacing:.18em; text-transform:uppercase; color:var(--accent); font-weight:600;}
  :focus-visible{outline:2px solid var(--accent); outline-offset:3px;}

  header{position:sticky; top:0; z-index:50; background:rgba(247,243,236,.9); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); padding-top:env(safe-area-inset-top,0px);}
  .nav{display:flex; align-items:center; justify-content:space-between; height:76px;}
  .brand{font-family:'Fraunces',serif; font-size:1.25rem; letter-spacing:.04em;}
  .brand b{color:var(--wood-deep); font-weight:600;}
  .back-link{font-size:.85rem; font-weight:600; color:var(--wood-deep);}
  .cta-btn{display:inline-block; background:var(--charcoal); color:var(--paper); padding:13px 26px; border-radius:2px; font-size:.9rem; font-weight:600;}

  main.wrap{padding-top:36px; padding-bottom:72px;}
  .layout{display:grid; gap:32px;}
  @media(min-width:860px){ .layout{grid-template-columns:1.2fr 1fr; align-items:start;} }

  .photo{display:block; background:var(--paper); border:1px solid var(--line); border-radius:4px; overflow:hidden;}
  .photo img{display:block; width:100%; height:auto; max-height:78vh; object-fit:contain;}
  .photo-note{font-size:.75rem; color:var(--charcoal-soft); margin-top:8px;}
  .no-photo{aspect-ratio:4/3; display:flex; align-items:center; justify-content:center; color:#fff; font-size:.75rem; letter-spacing:.12em; text-transform:uppercase; background:linear-gradient(135deg,#cba274,#7d5539);}

  .info h1{font-size:clamp(1.8rem,5vw,2.5rem); margin-top:10px;}
  .desc{margin-top:16px; color:var(--charcoal-soft); font-size:1.02rem; white-space:pre-line;}
  .price{display:inline-block; margin-top:20px; font-size:.85rem; letter-spacing:.04em; text-transform:uppercase; color:var(--accent); font-weight:600;}
  .pill{display:inline-block; margin-top:14px; border:1px solid var(--line); padding:6px 14px; border-radius:30px; font-size:.8rem; color:var(--charcoal-soft);}
  .actions{margin-top:28px; display:flex; flex-wrap:wrap; gap:12px;}
  .link-btn{display:inline-block; border:1px solid var(--charcoal); padding:12px 22px; border-radius:2px; font-size:.9rem; font-weight:600;}
  .msg{padding:80px 0; text-align:center; color:var(--charcoal-soft);}

  footer{background:var(--charcoal); color:var(--ivory); padding:40px 0; text-align:center; font-size:.82rem;}
</style>
</head>
<body>

<header>
  <div class="wrap nav">
    <a href="index.html" class="brand"><b>FUJAIL</b> FURNITURE</a>
    <a href="index.html" class="back-link" id="backLink">← Back</a>
  </div>
</header>

<main class="wrap" id="content"><p class="msg">Loading…</p></main>

<footer>
  <div class="wrap">© <span id="year"></span> Fujail Furniture. All rights reserved.</div>
</footer>

<script>
document.getElementById('year').textContent = new Date().getFullYear();

const SUPABASE_URL = "https://cixlmdmycwxuvguzsbbh.supabase.co";
const SUPABASE_KEY = "sb_publishable_7M67DGKa0cpRKCel2IfMGw_uHFjKBO_";

async function fetchTable(table, query) {
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}?${query}`, {
      headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` },
    });
    if (!res.ok) throw new Error(`${table} fetch failed: ${res.status}`);
    return await res.json();
  } catch (err) {
    console.error('Supabase fetch error:', err);
    return null;
  }
}

function el(tag, className, text) {
  const e = document.createElement(tag);
  if (className) e.className = className;
  if (text !== undefined && text !== null) e.textContent = text;
  return e;
}

function showMessage(text) {
  const box = document.getElementById('content');
  box.innerHTML = '';
  const p = el('p', 'msg', text);
  const back = el('a', 'link-btn', '← Back to Home');
  back.href = 'index.html';
  back.style.marginTop = '16px';
  p.appendChild(document.createElement('br'));
  p.appendChild(back);
  box.appendChild(p);
}

async function load() {
  const id = new URLSearchParams(window.location.search).get('id');
  if (!id || !/^\d+$/.test(id)) { showMessage('This piece could not be found.'); return; }

  const rows = await fetchTable('Featured_Products', `select=*&id=eq.${id}&limit=1`);
  if (rows === null) { showMessage('Could not load this piece right now. Please try again.'); return; }
  const item = rows[0];
  if (!item) { showMessage('This piece could not be found.'); return; }

  document.title = `${item.name} — Fujail Furniture`;
  if (item.category) {
    const back = document.getElementById('backLink');
    back.href = `featured-category.html?name=${encodeURIComponent(item.category)}`;
    back.textContent = `← ${item.category}`;
  }

  const layout = el('div', 'layout');

  // Photo (tap to open the full-size picture)
  const photoCol = el('div');
  if (item.image_url) {
    const a = el('a', 'photo');
    a.href = item.image_url; a.target = '_blank'; a.rel = 'noopener';
    const img = document.createElement('img');
    img.src = item.image_url; img.alt = item.name;
    a.appendChild(img);
    photoCol.appendChild(a);
    photoCol.appendChild(el('p', 'photo-note', 'Tap the photo to view it full size.'));
  } else {
    photoCol.appendChild(el('div', 'no-photo', 'Photo coming soon'));
  }

  // Details
  const info = el('div', 'info');
  info.appendChild(el('p', 'eyebrow', item.category ? `Featured · ${item.category}` : 'Featured Piece'));
  info.appendChild(el('h1', 'serif', item.name));
  if (item.description) info.appendChild(el('p', 'desc', item.description));
  info.appendChild(el('div', 'price', item.price || 'Enquire for Price'));
  if (item.category) info.appendChild(el('div')).appendChild(el('span', 'pill', item.category));

  const actions = el('div', 'actions');
  const quote = el('a', 'cta-btn', 'Get a Quote');
  quote.href = 'index.html#contact';
  actions.appendChild(quote);
  if (item.category) {
    const more = el('a', 'link-btn', `More ${item.category} pieces`);
    more.href = `featured-category.html?name=${encodeURIComponent(item.category)}`;
    actions.appendChild(more);
  }
  info.appendChild(actions);

  layout.appendChild(photoCol);
  layout.appendChild(info);
  const box = document.getElementById('content');
  box.innerHTML = '';
  box.appendChild(layout);
}
load();
</script>
</body>
</html>
